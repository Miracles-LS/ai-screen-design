name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]      # 若你的默认分支是 master，改成 master
  workflow_dispatch:       # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4     # 自动读取 package.json 的 packageManager 版本

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile   # 若无 pnpm-lock.yaml 或报错，改用 pnpm install

      - name: Build（注入后端地址）
        run: pnpm build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}   # 来自仓库 Settings → Secrets 中设置的 VITE_API_URL

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist                # Vite 构建产物目录

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
