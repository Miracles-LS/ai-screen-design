name: 前端自动部署（develop → GitHub Pages）

on:
  push:
    branches: [develop] # 若你的默认分支是 master，改成 master
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建前端产物
    runs-on: ubuntu-latest
    steps:
      - name: 拉取前端代码（develop 分支）
        uses: actions/checkout@v4

      - name: 安装 pnpm 包管理器
        uses: pnpm/action-setup@v4 # 自动读取 package.json 的 packageManager 版本
        with:
          version: 9 # ② 新增这两行（package.json 没有 packageManager 字段，不写会报错）

      - name: 安装 Node.js 22 并启用依赖缓存
        uses: actions/setup-node@v4
        with:
          node-version: 22 # ③ 原 20 → 22（你的 engines 要求 ^22.18，Vite 8 跑不了 20）
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile # 若无 pnpm-lock.yaml 或报错，改用 pnpm install

      - name: 构建前端并注入后端地址
        run: pnpm build-only
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }} # 来自仓库 Settings → Secrets 中设置的 VITE_API_URL

      - name: 上传构建产物供 Pages 部署
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist # Vite 构建产物目录

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布站点到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
